spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.2.61:5432/agni_test}
spring.datasource.username=${DB_USERNAME:test}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

ai.agent.api.url=${AI_AGENT_API_LINK:http://localhost:8000}

vectordb.qdrant.host=${QDRANT_HOST:192.168.2.61}
vectordb.qdrant.port=${QDRANT_PORT:6334}

embedding.collection.invoice=${QDRANT_INVOICE_COLLECTION_NAME:test_invoices}
embedding.collection.external-transaction=${QDRANT_EXTERNAL_TRANSACTION_COLLECTION_NAME:test_external_transactions}

app.i18n.default-locale=${I18N_DEFAULT_LOCALE:fr}
app.i18n.locales=${I18N_LOCALES:fr,en}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

agni.secret.key = ${AGNI_SECRET_KEY:my-super-secret-local-development-key-123456}
agni.local.auth = ${AGNI_LOCAL_AUTH:true}
agni.dev.tool = ${AGNI_DEV_TOOL:false}
agni.auth0.audience = agni-api

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_SET_URI}

plaid.client.clientId=${PLAID_API_CLIENT_ID:66b5e48df271e2001a12e769}
plaid.client.secret=${PLAID_API_SECRET:de350503ed97d8da5f3224a85cc386}
plaid.client.redirectionUrl=${PLAID_REDIRECT_URL:http://localhost:3000}
plaid.client.isSandbox=${PLAID_CLIENT_IS_SANDBOX:true}

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD}
