name: Build & Deploy
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions: {contents: read, packages: write}

env: {REGISTRY: ghcr.io/xx-code}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend: ['apps/agni-web/**', 'config/frontend/**']
            api:      ['apps/agni_api/**', 'config/api/**']
            agent:    ['apps/agni-ai/**',  'config/agent/**']

      - id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "env=dev"  >> "$GITHUB_OUTPUT"
            echo "overlay=demo" >> "$GITHUB_OUTPUT"
          else
            echo "env=main" >> "$GITHUB_OUTPUT"
            echo "overlay=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Frontend
        if: steps.filter.outputs.frontend == 'true'
        run: |
          IMG=${{ env.REGISTRY }}/agni-frontend
          docker build -f config/frontend/Dockerfile -t $IMG:${{ steps.vars.outputs.env }} -t $IMG:${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.sha_short }} .
          docker push --all-tags $IMG

      - name: Build Api
        if: steps.filter.outputs.api == 'true'
        run: |
          IMG=${{ env.REGISTRY }}/agni-backend
          docker build -f config/api/Dockerfile -t $IMG:${{ steps.vars.outputs.env }} -t $IMG:${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.sha_short }} .
          docker push --all-tags $IMG

      - name: Build Agent
        if: steps.filter.outputs.agent == 'true'
        run: |
          IMG=${{ env.REGISTRY }}/agni-backend-ai
          docker build -f config/agent/Dockerfile -t $IMG:${{ steps.vars.outputs.env }} -t $IMG:${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.sha_short }} .
          docker push --all-tags $IMG

      # tous les composants taggés au même sha (reproducibilité du déploiement)
      - name: Ensure sha tags
        if: github.ref_type == 'branch'
        run: |
          SHA=${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.sha_short }}
          for comp in agni-frontend agni-backend agni-backend-ai; do
            IMG=${{ env.REGISTRY }}/$comp
            docker manifest inspect $IMG:$SHA >/dev/null 2>&1 && continue
            if docker manifest inspect $IMG:${{ steps.vars.outputs.env }} >/dev/null 2>&1; then
              docker pull $IMG:${{ steps.vars.outputs.env }}
              docker tag $IMG:${{ steps.vars.outputs.env }} $IMG:$SHA
            else
              case $comp in
                agni-frontend)  docker build -f config/frontend/Dockerfile -t $IMG:${{ steps.vars.outputs.env }} -t $IMG:$SHA . ;;
                agni-backend)   docker build -f config/api/Dockerfile -t $IMG:${{ steps.vars.outputs.env }} -t $IMG:$SHA . ;;
                agni-backend-ai) docker build -f config/agent/Dockerfile -t $IMG:${{ steps.vars.outputs.env }} -t $IMG:$SHA . ;;
              esac
            fi
            docker push --all-tags $IMG
          done

      - name: Release version tag
        if: github.ref_type == 'tag'
        run: |
          for comp in agni-frontend agni-backend agni-backend-ai; do
            IMG=${{ env.REGISTRY }}/$comp
            docker pull $IMG:main
            docker tag $IMG:main $IMG:${{ github.ref_name }}
            docker push $IMG:${{ github.ref_name }}
          done

      - name: Update homelab overlay (GitOps auto-deploy)
        if: github.ref_type == 'branch'
        run: |
          git clone https://${{ secrets.HOMELAB_GITHUB_TOKEN }}@github.com/xx-code/homelab.git homelab
          cd homelab
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          ENV=${{ steps.vars.outputs.env }} SHA=${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.sha_short }}
          sed -i "s|newTag: $ENV-.*|newTag: $SHA|" k8s/apps/agni/overlays/${{ steps.vars.outputs.overlay }}/kustomization.yaml
          git diff --quiet || {
            git commit -am "chore(deploy): bump agni $ENV sha-${{ steps.vars.outputs.sha_short }}"
            git push origin main
          }
